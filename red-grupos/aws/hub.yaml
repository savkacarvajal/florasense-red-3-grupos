AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Hub de la red de 3 grupos (Mosquitto con TLS + dashboard compartido) en una EC2 con IP elastica.
  8884 = puentes MQTT/TLS de las Raspberry, 9443 = dashboard HTTPS/WSS. Sin SSH: se administra con SSM.

Parameters:
  Grupos:
    Type: String
    Default: "grupo-1 grupo-2 grupo-3"
    Description: Nombres de los grupos, separados por espacio (el orden fija el color en el dashboard)
  Repo:
    Type: String
    Default: https://github.com/savkacarvajal/florasense-red-3-grupos.git
  TipoInstancia:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t2.micro]
  PerfilInstancia:
    Type: String
    Default: LabInstanceProfile
    Description: Perfil IAM con permisos de SSM (en AWS Academy Learner Lab ya existe LabInstanceProfile)
  Ami:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Resources:
  IpHub:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: red-grupos-hub }]

  SgHub:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Hub red de grupos - solo MQTT/TLS 8884 y HTTPS/WSS 9443
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8884, ToPort: 8884, CidrIp: 0.0.0.0/0, Description: Puentes MQTT TLS de las Raspberry }
        - { IpProtocol: tcp, FromPort: 9443, ToPort: 9443, CidrIp: 0.0.0.0/0, Description: Dashboard HTTPS y WSS }
      Tags: [{ Key: Name, Value: red-grupos-hub }]

  Hub:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref Ami
      InstanceType: !Ref TipoInstancia
      IamInstanceProfile: !Ref PerfilInstancia
      SecurityGroupIds: [!GetAtt SgHub.GroupId]
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1 }
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeSize: 10, VolumeType: gp3, Encrypted: true }
      Tags: [{ Key: Name, Value: red-grupos-hub }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > /var/log/red-grupos.log 2>&1
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y docker.io docker-compose-v2 git openssl
          systemctl enable --now docker
          git clone --depth 1 ${Repo} /opt/red
          cd /opt/red/red-grupos
          docker pull eclipse-mosquitto:2.0
          # La IP elastica queda dentro del certificado del hub: no cambia aunque la instancia se detenga.
          ./crear-red.sh ${IpHub} ${Grupos}
          docker compose up -d
          echo LISTO > /opt/red/LISTO

  AsociarIp:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt IpHub.AllocationId
      InstanceId: !Ref Hub

Outputs:
  IpHub:
    Value: !Ref IpHub
  Dashboard:
    Value: !Sub "https://${IpHub}:9443"
  Instancia:
    Value: !Ref Hub
