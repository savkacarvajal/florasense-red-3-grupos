# Hub de la red de grupos. Se levanta solo en la Raspberry que hace de hub,
# después de correr ./crear-red.sh <IP>.
services:
  hub:
    image: eclipse-mosquitto:2.0
    container_name: red_grupos_hub
    ports:
      - "8884:8884"   # puentes de los grupos (MQTT + TLS)
      - "9443:9443"   # dashboard (HTTPS + WSS)
    volumes:
      - ./hub/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./salida/certs:/mosquitto/config/salida/certs:ro
      - ./salida/pwfile:/mosquitto/config/salida/pwfile:ro
      - ./salida/acl:/mosquitto/config/salida/acl:ro
      - ./dashboard:/srv/dashboard:ro
      - hub_data:/mosquitto/data
    restart: unless-stopped

volumes:
  hub_data:
