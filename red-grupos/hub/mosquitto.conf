# Broker central (hub) de la red de grupos. Todo cifrado con TLS:
#   8884 -> puentes MQTT de las Raspberry de cada grupo (mqtts)
#   9443 -> dashboard en el navegador (https + wss en el mismo puerto)
allow_anonymous false
password_file /mosquitto/config/salida/pwfile
acl_file /mosquitto/config/salida/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

listener 8884
protocol mqtt
cafile /mosquitto/config/salida/certs/ca.crt
certfile /mosquitto/config/salida/certs/server.crt
keyfile /mosquitto/config/salida/certs/server.key
tls_version tlsv1.2

listener 9443
protocol websockets
certfile /mosquitto/config/salida/certs/server.crt
keyfile /mosquitto/config/salida/certs/server.key
tls_version tlsv1.2
# Mosquitto sirve también la página del dashboard en este puerto
http_dir /srv/dashboard
